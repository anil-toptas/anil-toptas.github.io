<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anıl Toptaş – Games</title>
  <meta name="description" content="Independent mobile games by Anıl Toptaş.">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="lang.js"></script>
</head>
<body>
<main>
  <div class="topbar">
    <span class="muted">anil-toptas.github.io</span>
    <div class="lang-switch" role="group" aria-label="Language / Dil">
      <button type="button" data-set="en" aria-pressed="false">English</button>
      <button type="button" data-set="tr" aria-pressed="false">Türkçe</button>

  </div>

  <h1>Anıl Toptaş</h1>

  <p class="muted" data-lang="tr">Bağımsız mobil oyunlar.</p>

  <a class="card hero" href="neon-trails/" style="text-decoration:none;color:inherit">
    <img src="neon-trails/icon.png" alt="" width="112" height="112">
    <div>
      <h2 style="margin:0;color:var(--text)">Neon Trails</h2>
      <p class="muted" data-lang="en" style="margin:4px 0 0">Neon puzzle game for iPhone – connect the dots, fill the grid.</p>
      <p class="muted" data-lang="tr" style="margin:4px 0 0">iPhone için neon bulmaca oyunu – noktaları birleştir, ızgarayı doldur.</p>
    </div>
  </a>

  <footer>
    <span data-lang="en">Contact:</span><span data-lang="tr">İletişim:</span>
    <a href="mailto:neontrails@outlook.com">neontrails@outlook.com</a>
  </footer>
</main>

</html>
